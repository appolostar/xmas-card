<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1026">
<title>圣诞快乐</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{
    background:radial-gradient(120% 80% at 50% 0%,#1b2a5e 0%,#0e1330 45%,#070a18 100%);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    color:#fff;position:relative;overflow:hidden;
    display:flex;align-items:center;justify-content:center;
    -webkit-user-select:none;user-select:none;
  }

  /* ---------- 星星 ---------- */
  .stars{position:absolute;inset:0;pointer-events:none;
    background-image:
      radial-gradient(1.5px 1.5px at 12% 18%,rgba(255,255,255,.95),transparent),
      radial-gradient(1px 1px at 28% 8%,rgba(255,255,255,.75),transparent),
      radial-gradient(1.5px 1.5px at 68% 14%,rgba(255,255,255,.85),transparent),
      radial-gradient(1px 1px at 84% 26%,rgba(255,255,255,.65),transparent),
      radial-gradient(1px 1px at 46% 32%,rgba(255,255,255,.7),transparent),
      radial-gradient(1.5px 1.5px at 92% 6%,rgba(255,255,255,.95),transparent),
      radial-gradient(1px 1px at 6% 40%,rgba(255,255,255,.6),transparent),
      radial-gradient(1px 1px at 58% 4%,rgba(255,255,255,.7),transparent);
    animation:twinkle 4s ease-in-out infinite alternate}
  @keyframes twinkle{from{opacity:.4}to{opacity:.95}}

  /* ---------- 纯 CSS 雪 ---------- */
  .snow{position:absolute;inset:0;pointer-events:none;overflow:hidden}
  .snow i{position:absolute;top:-6%;left:var(--x);width:var(--sz);height:var(--sz);
    border-radius:50%;background:#fff;opacity:.85;
    animation:fall var(--d) linear infinite;animation-delay:var(--dl)}
  @keyframes fall{
    0%{transform:translate3d(0,-10vh,0)}
    50%{transform:translate3d(18px,50vh,0)}
    100%{transform:translate3d(-14px,112vh,0)}
  }

  .stage{position:relative;z-index:3;width:100%;max-width:560px;height:100%;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:calc(env(safe-area-inset-top) + 20px) 22px calc(env(safe-area-inset-bottom) + 20px)}

  h1{font-size:clamp(30px,9vw,54px);letter-spacing:.14em;font-weight:800;text-align:center;
    background:linear-gradient(180deg,#fff 0%,#ffe9a8 55%,#ffb648 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 18px rgba(255,190,80,.45));
    animation:breathe 3.2s ease-in-out infinite}
  @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
  .en{font-size:clamp(11px,3.2vw,14px);letter-spacing:.42em;color:#9fc0ff;margin-top:10px;
    text-transform:uppercase;opacity:.9}

  /* ---------- 树 ---------- */
  .tree{position:relative;width:min(74vw,290px);aspect-ratio:.78;
    margin:clamp(12px,3.5vh,30px) 0 8px;animation:sway 6s ease-in-out infinite}
  @keyframes sway{0%,100%{transform:rotate(-.6deg)}50%{transform:rotate(.6deg)}}

  .star-top{position:absolute;top:-5%;left:50%;width:16%;aspect-ratio:1;margin-left:-8%;
    background:#ffd257;clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);
    filter:drop-shadow(0 0 12px rgba(255,210,87,.95));animation:glow 2.4s ease-in-out infinite}
  @keyframes glow{0%,100%{opacity:.75;transform:scale(.94)}50%{opacity:1;transform:scale(1.08)}}

  .tier{position:absolute;left:50%;transform:translateX(-50%);
    background:linear-gradient(160deg,#2f8f5b 0%,#1d6b41 55%,#12522f 100%);
    clip-path:polygon(50% 0%,100% 100%,0% 100%)}
  .tier::after{content:"";position:absolute;inset:0;
    background:linear-gradient(205deg,rgba(255,255,255,.24),transparent 55%)}
  .t1{top:12%;height:40%;width:72%}
  .t2{top:38%;height:38%;width:88%}
  .t3{top:62%;height:36%;width:100%}

  .trunk{position:absolute;bottom:-3%;left:50%;transform:translateX(-50%);width:13%;height:13%;
    background:linear-gradient(180deg,#7a4a25,#4d2c12);border-radius:2px}

  .lights span{position:absolute;width:9px;height:9px;border-radius:50%;
    background:currentColor;box-shadow:0 0 10px 2px currentColor;
    animation:blink 1.8s ease-in-out infinite}
  .lights span:nth-child(3n){color:#ff5f6d}
  .lights span:nth-child(3n+1){color:#5ce1ff}
  .lights span:nth-child(3n+2){color:#ffcf5a}
  @keyframes blink{0%,100%{opacity:.2;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}

  .gifts{position:absolute;bottom:-8%;left:50%;transform:translateX(-50%);display:flex;gap:6px}
  .gifts i{display:block;width:22px;height:18px;border-radius:3px;position:relative;
    box-shadow:inset 0 -6px 0 rgba(0,0,0,.18)}
  .gifts i::after{content:"";position:absolute;top:0;bottom:0;left:50%;width:4px;margin-left:-2px;
    background:rgba(255,255,255,.75)}
  .g1{background:#e04a5a}.g2{background:#4a86e0}.g3{background:#e0b04a}

  /* ---------- 祝词：不靠 JS 也会自己出来 ---------- */
  .msg{margin-top:clamp(16px,4.5vh,34px);text-align:center;line-height:1.95;
    font-size:clamp(14px,4.2vw,17px);color:#e8eefc;max-width:22em;
    animation:msgIn 1.1s ease 2.2s both}
  @keyframes msgIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
  .msg b{color:#ffd98a;font-weight:600}

  .hint{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 12px);
    text-align:center;font-size:12px;color:#7f8dbb;letter-spacing:.2em;
    animation:fade 2.6s ease-in-out infinite}
  @keyframes fade{0%,100%{opacity:.2}50%{opacity:.7}}
</style>
</head>
<body>
<div class="stars"></div>

<!-- 雪：纯 CSS，不用 JS -->
<div class="snow" aria-hidden="true">
  <i style="--x:4%;--sz:3px;--d:11s;--dl:-1s"></i>
  <i style="--x:11%;--sz:2px;--d:9s;--dl:-6s"></i>
  <i style="--x:17%;--sz:4px;--d:13s;--dl:-3s"></i>
  <i style="--x:23%;--sz:2px;--d:8s;--dl:-7s"></i>
  <i style="--x:29%;--sz:3px;--d:12s;--dl:-2s"></i>
  <i style="--x:35%;--sz:2px;--d:10s;--dl:-9s"></i>
  <i style="--x:41%;--sz:4px;--d:14s;--dl:-5s"></i>
  <i style="--x:47%;--sz:2px;--d:9s;--dl:-4s"></i>
  <i style="--x:53%;--sz:3px;--d:11s;--dl:-8s"></i>
  <i style="--x:59%;--sz:2px;--d:8s;--dl:-2s"></i>
  <i style="--x:65%;--sz:4px;--d:13s;--dl:-6s"></i>
  <i style="--x:71%;--sz:2px;--d:10s;--dl:-1s"></i>
  <i style="--x:77%;--sz:3px;--d:12s;--dl:-5s"></i>
  <i style="--x:83%;--sz:2px;--d:9s;--dl:-9s"></i>
  <i style="--x:89%;--sz:4px;--d:14s;--dl:-3s"></i>
  <i style="--x:95%;--sz:2px;--d:10s;--dl:-7s"></i>
  <i style="--x:8%;--sz:2px;--d:15s;--dl:-11s"></i>
  <i style="--x:20%;--sz:3px;--d:16s;--dl:-4s"></i>
  <i style="--x:32%;--sz:2px;--d:14s;--dl:-10s"></i>
  <i style="--x:44%;--sz:3px;--d:17s;--dl:-6s"></i>
  <i style="--x:56%;--sz:2px;--d:15s;--dl:-12s"></i>
  <i style="--x:68%;--sz:3px;--d:16s;--dl:-8s"></i>
  <i style="--x:80%;--sz:2px;--d:13s;--dl:-11s"></i>
  <i style="--x:92%;--sz:3px;--d:17s;--dl:-2s"></i>
</div>

<div class="stage">
  <h1>圣诞快乐</h1>
  <div class="en">Merry Christmas</div>

  <div class="tree" id="tree">
    <div class="star-top"></div>
    <div class="tier t1"></div>
    <div class="tier t2"></div>
    <div class="tier t3"></div>
    <div class="trunk"></div>
    <div class="lights">
      <span style="left:50%;top:16%;animation-delay:0s"></span>
      <span style="left:38%;top:26%;animation-delay:.2s"></span>
      <span style="left:62%;top:26%;animation-delay:.4s"></span>
      <span style="left:30%;top:40%;animation-delay:.6s"></span>
      <span style="left:50%;top:44%;animation-delay:.8s"></span>
      <span style="left:70%;top:40%;animation-delay:1s"></span>
      <span style="left:24%;top:58%;animation-delay:1.2s"></span>
      <span style="left:44%;top:60%;animation-delay:1.4s"></span>
      <span style="left:58%;top:62%;animation-delay:.3s"></span>
      <span style="left:76%;top:58%;animation-delay:.9s"></span>
      <span style="left:34%;top:74%;animation-delay:1.6s"></span>
      <span style="left:66%;top:74%;animation-delay:.5s"></span>
    </div>
    <div class="gifts"><i class="g1"></i><i class="g2"></i><i class="g3"></i></div>
  </div>

  <div class="msg" id="msg">
    愿你这个十二月<br>有暖的雪、热的饮、想见的人<br>和一件让你笑出来的小事。
  </div>
</div>
<div class="hint">Merry Christmas</div>

<script>
(function(){
  // ?to=小明 可以把称呼带进祝词；没有 JS 的环境也不影响上面那些动画
  try{
    var to = new URLSearchParams(location.search).get('to');
    if(to){
      var msg = document.getElementById('msg');
      var name = to.replace(/[<>&"]/g,'').slice(0,12);
      if(name) msg.innerHTML = '<b>' + name + '</b>，<br>' + msg.innerHTML;
    }
  }catch(e){}
})();
</script>
</body>
</html>
